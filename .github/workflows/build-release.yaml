name: Build and release

# 自动发布：
# 1. 手动触发：Actions 页面点击 "Run workflow" 并填写版本号（例如 1.4.0）。
# 2. 推送版本号标签（例如 git tag 1.4.0）时自动触发。
#
# tag 使用纯版本号（不带 v 前缀）。构建 Linux / Windows 产物后，
# 打包为 tar.gz / zip 并创建 GitHub Release。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.4.0"
        required: true
        type: string
  push:
    tags:
      - "[0-9]*"

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yaml

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Compute version and tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            RAW="$GITHUB_REF_NAME"
          else
            RAW="${{ inputs.version }}"
          fi
          # tag 使用纯版本号（不带 v 前缀）；若误填了 v / V 前缀则自动去掉
          RAW="${RAW#v}"
          RAW="${RAW#V}"
          VERSION="$RAW"
          TAG="$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        run: |
          mkdir -p releases
          tar -C artifacts/sql_mm-linux -czf "releases/sql_mm-linux-${{ steps.version.outputs.version }}.tar.gz" .
          (cd artifacts/sql_mm-windows && zip -r "../../releases/sql_mm-windows-${{ steps.version.outputs.version }}.zip" .)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            releases/sql_mm-linux-${{ steps.version.outputs.version }}.tar.gz
            releases/sql_mm-windows-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
